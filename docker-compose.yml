
services:
  postgres:
    image: postgres:17
    container_name: studygraph-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: studygraph
      POSTGRES_USER: studygraph
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studygraph -d studygraph"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
